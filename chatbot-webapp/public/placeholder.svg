<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="800" cy="400" r="350" fill="url(#glow)" filter="blur(80px)" />
  <circle cx="400" cy="800" r="300" fill="url(#blueGlow)" filter="blur(70px)" />
  <g transform="translate(600, 600)" text-anchor="middle" fill="#ffffff">
    <circle cx="0" cy="-60" r="45" fill="#ea580c" />
    <path d="M -15 -60 L 15 -60 M 0 -75 L 0 -45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <text y="40" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="1">SSE CLOUD ERP</text>
    <text y="85" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="2">ENTERPRISE RAG PLATFORM</text>
  </g>
</svg>
