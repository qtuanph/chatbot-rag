name: chatbot-webapp

services:
  webapp:
    image: chatbot-webapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-webapp
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "chatbot-api.sse.net.vn:host-gateway"
      - "chatbot.sse.net.vn:host-gateway"
    restart: unless-stopped
