name: Enterprise CI & Guardrails Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guardrails:
    name: Line Endings, Policy & Security Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Line Endings (LF Enforcement)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for CRLF line endings in text files..."
          CRLF_FILES=$(git grep -I --files-with-matches $'\r' -- \
            '*.py' '*.sh' '*.conf' '*.json' '*.md' \
            '*.ts' '*.tsx' '*.js' '*.jsx' 'Dockerfile' \
            '*.txt' '*.css' '*.mjs' \
            2>/dev/null || true)

          if [ -n "$CRLF_FILES" ]; then
            echo "❌ CRLF detected in the following files:"
            echo "$CRLF_FILES"
            exit 1
          fi
          echo "✅ All files strictly use LF line endings"

      - name: Check Docs-First Update Policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)

            if [ -n "$CHANGED_FILES" ]; then
              CODE_CHANGED=0
              DOCS_CHANGED=0
              CODE_PATTERNS='^(app/|chatbot-api/|chatbot-webapp/|ops/init\.sql$|docker-compose\.yml$)'
              DOCS_PATTERNS='^(docs/|AGENTS\.md$|README\.md$)'

              while IFS= read -r file; do
                [ -z "$file" ] && continue
                [[ "$file" =~ $CODE_PATTERNS ]] && CODE_CHANGED=1
                [[ "$file" =~ $DOCS_PATTERNS ]] && DOCS_CHANGED=1
              done <<< "$CHANGED_FILES"

              if [ "$CODE_CHANGED" -eq 1 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
                echo "::error::This PR changes code but does not update docs or AGENTS.md"
                exit 1
              fi
            fi
          fi
          echo "✅ Docs-first policy check passed"

      - name: Check HTTP Status Helper Policy
        run: |
          if [ -f ".github/scripts/check_http_status_policy.py" ]; then
            python .github/scripts/check_http_status_policy.py
          fi

  backend-ci:
    name: Backend Pytest & Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: 'chatbot-api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Black & Flake8 Linter
        run: |
          python -m black app --check --line-length=120
          python -m flake8 app --select=F,E1,E2,E4,E9,W --ignore=E203,E501,W293,W292,W391,W503,W504

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          APP_ENV: testing
          JWT_SECRET: "Test_Jwt_Secret_Key_At_Least_32_Chars_123!"
          S3_SECRET_KEY: "test_s3_secret_key_123"
          S3_ACCESS_KEY: "test_s3_access_key_123"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python -m pytest tests/

  frontend-ci:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot-webapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: chatbot-webapp/package-lock.json

      - name: Install Webapp Dependencies
        run: |
          npm ci

      - name: Run TypeScript Compiler Check
        run: |
          npx tsc --noEmit

  secret-scan:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
