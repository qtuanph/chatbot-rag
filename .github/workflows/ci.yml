name: Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd chatbot-api
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Black Formatter Check
        run: |
          python -m black app --check --line-length=120

      - name: Run Flake8 Linter
        run: |
          python -m flake8 app --select=F,E1,E2,E4,E9,W --ignore=E203,E501,W293,W292,W391,W503,W504

      - name: Run Pytest Suite
        run: |
          cd chatbot-api
          pytest tests/

  frontend-typecheck:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: chatbot-webapp/package-lock.json

      - name: Install Webapp Dependencies
        run: |
          cd chatbot-webapp
          npm ci

      - name: Run TypeScript Compiler Check
        run: |
          cd chatbot-webapp
          npx tsc --noEmit
