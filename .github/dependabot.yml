version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/chatbot-api"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 50
    groups:
      all-python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/chatbot-webapp"
    schedule:
      interval: "monthly"
      time: "03:15"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 50
    groups:
      all-webapp-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "devDependencies"
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      all-root-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/chatbot-api"
    schedule:
      interval: "monthly"
      time: "03:45"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      all-api-docker-images:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      # Python 3.13 is pinned deliberately (dependency compatibility);
      # review Python bumps manually during annual maintenance.
      # NOTE: 3.13 -> 3.14 counts as semver-MINOR for Docker tags.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/chatbot-webapp"
    schedule:
      interval: "monthly"
      time: "03:45"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      all-webapp-docker-images:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker-compose"
    directory: "/chatbot-api"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      all-compose-images:
        patterns:
          - "*"
    labels:
      - "dependencies"
